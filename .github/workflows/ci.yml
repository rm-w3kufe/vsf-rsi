name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Clone socratic-engine (hard dependency)
        run: |
          git clone --depth 1 https://github.com/rm-w3kufe/socratic-engine.git ~/socratic-engine
      - name: Install package (core)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run tests with coverage
        run: |
          pip install pytest-cov
          python -m pytest tests/ -q --cov=vsf_rsi --cov-report=term-missing --cov-fail-under=80
      - name: Import smoke test
        run: |
          python -c "from vsf_rsi import RSIObserver, RSIMode, RSIMetrics; print('Import OK')"
          python -c "from vsf_rsi.rsi_observer import discriminate, resolve_error, get_expected; print('Core OK')"

  integration:
    name: Integration (real socratic-engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clone socratic-engine
        run: |
          git clone --depth 1 https://github.com/rm-w3kufe/socratic-engine.git ~/socratic-engine
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run integration tests
        run: |
          python -m pytest tests/test_rsi_observer_integration.py -v -k "RealEngine or FeedbackLoop or Dashboard or L3 or L4" --tb=short
